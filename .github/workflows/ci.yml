name: CI

on:
  push:
    branches: ["**"]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    name: Testy i APK
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4

      - name: Weryfikacja gradle-wrapper.jar
        uses: gradle/actions/wrapper-validation@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4

      - uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-35 build-tools;35.0.0'

      # Bez tego każdy przebieg generuje własny klucz debugowy i kolejnego APK nie da się
      # zainstalować na wierzch poprzedniego — Android odrzuca zmianę podpisu.
      - name: Klucz debugowy z cache
        uses: actions/cache@v4
        with:
          path: ~/.android/debug.keystore
          key: debug-keystore-v1

      - name: Utwórz klucz debugowy, jeśli cache był pusty
        run: |
          if [ ! -f ~/.android/debug.keystore ]; then
            mkdir -p ~/.android
            keytool -genkeypair -v \
              -keystore ~/.android/debug.keystore \
              -storepass android -keypass android -alias androiddebugkey \
              -keyalg RSA -keysize 2048 -validity 10000 \
              -dname "CN=Android Debug,O=Android,C=US"
          fi

      - name: Testy jednostkowe (JVM)
        run: ./gradlew --no-daemon testDebugUnitTest

      - name: Lint
        run: ./gradlew --no-daemon lintDebug

      - name: Kompilacja testów instrumentacyjnych
        run: ./gradlew --no-daemon assembleDebugAndroidTest

      - name: APK debug i release
        run: ./gradlew --no-daemon assembleDebug assembleRelease

      - name: Lista zbudowanych APK
        run: |
          echo "### Zbudowane APK" >> $GITHUB_STEP_SUMMARY
          echo "Nie wiesz, jaką masz architekturę? Weź **app-universal-release.apk**." >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Plik | Rozmiar |" >> $GITHUB_STEP_SUMMARY
          echo "|---|---|" >> $GITHUB_STEP_SUMMARY
          for f in app/build/outputs/apk/release/*.apk; do
            printf "| %s | %s |\n" "$(basename "$f")" "$(du -h "$f" | cut -f1)" >> $GITHUB_STEP_SUMMARY
          done

      - name: APK do instalacji
        uses: actions/upload-artifact@v4
        with:
          name: nightvox-apk
          path: |
            app/build/outputs/apk/debug/*.apk
            app/build/outputs/apk/release/*.apk
          if-no-files-found: error
          retention-days: 30

      - name: Raporty (gdy coś padnie)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: raporty
          path: |
            app/build/reports/
            app/build/test-results/
          retention-days: 7

  instrumented:
    name: Testy instrumentacyjne (emulator)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    # Osobny job: emulator bywa kapryśny z powodów infrastrukturalnych i nie ma blokować
    # wydania APK, ale to jedyne miejsce, gdzie sprawdza się integralność .m4a i Room.
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4

      - uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-35 build-tools;35.0.0'

      - name: Przyspieszenie sprzętowe emulatora
        run: |
          sudo modprobe kvm || true
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
            | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Uruchom testy na emulatorze
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          profile: pixel_6
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          # RecorderServiceLifecycleTest wymaga widocznego Activity, żeby wystartował FGS
          # typu microphone (API 34+). Na emulatorze bez UI sprawdzałby tylko ścieżkę
          # odmowy — zostaje do uruchamiania ręcznego na urządzeniu.
          script: >-
            ./gradlew --no-daemon connectedDebugAndroidTest
            -Pandroid.testInstrumentationRunnerArguments.notClass=pl.nightvox.service.RecorderServiceLifecycleTest

      - name: Raporty (gdy coś padnie)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: raporty-instrumentacyjne
          path: |
            app/build/reports/androidTests/
            app/build/outputs/androidTest-results/
          retention-days: 7
